spring:
  application:
    name: payguard-payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/payguard_payments}
    username: ${SPRING_DATASOURCE_USERNAME:payguard}
    password: ${SPRING_DATASOURCE_PASSWORD:payguard_secret}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL:http://localhost:8081}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PAYGUARD_JWKS_URI:http://localhost:8180/realms/payguard/protocol/openid-connect/certs}
          issuer-uri: ${PAYGUARD_JWT_ISSUER:http://localhost:8180/realms/payguard}
server:
  port: 8082
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
payguard:
  internal:
    service-token: ${PAYGUARD_INTERNAL_SERVICE_TOKEN:}
  fraud:
    base-url: ${FRAUD_ENGINE_BASE_URL:http://localhost:8083}
    timeout-ms: ${FRAUD_ENGINE_TIMEOUT_MS:200}
    fallback-approve-max-amount-minor: ${FRAUD_FALLBACK_APPROVE_MAX_AMOUNT_MINOR:10000}
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  outbox:
    poll-interval-ms: ${PAYGUARD_OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${PAYGUARD_OUTBOX_BATCH_SIZE:50}
    # Attempts before an entry is copied to <topic>.dlq and skipped. With the 1s base and the
    # doubling backoff, 8 attempts spans roughly four minutes before giving up.
    max-attempts: ${PAYGUARD_OUTBOX_MAX_ATTEMPTS:8}
    base-backoff-ms: ${PAYGUARD_OUTBOX_BASE_BACKOFF_MS:1000}
    # Bounds the KafkaTemplate future the relay blocks on; without it a partitionless topic or an
    # unreachable broker parks the scheduler thread indefinitely.
    send-timeout-ms: ${PAYGUARD_OUTBOX_SEND_TIMEOUT_MS:10000}
